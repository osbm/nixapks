name: "💡 App request"
description: Create a new ticket for a new app request
title: "💡 App request: <title>"
labels: [
  "type: app request"
]
body:
  - type: input
    id: source_url
    attributes:
      label: "Source URL (git, svn, etc)"
    validations:
      required: true
  - type: input
    id: app_version
    attributes:
      label: "App Version"
      description: Latest stable version at the time of the request, as a markdown link to the release tag. This is only a snapshot, the app will be packaged at whatever version is latest when the work is done.
      placeholder: "e.g., [v1.0.0](https://github.com/owner/repo/releases/tag/v1.0.0)"
    validations:
      required: true
  - type: dropdown
    id: framework
    attributes:
      label: Select the framework
      multiple: false
      options:
        - Flutter
        - React Native
        - Gradle (kotlin or java)
        - Other
    validations:
      required: true
  - type: textarea
    id: additional_context
    attributes:
      label: "Additional Context"
      description: Provide any additional information that might be useful.
      placeholder: "issues, documentation, etc."
    validations:
      required: false
